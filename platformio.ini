; ============================================================
; LILYGO T-Display-S3 无人机 RID 监测固件
; 板卡: T-Display-S3 (ESP32-S3R8, 16MB Flash, 8MB PSRAM)
; 屏幕: ST7789V 170x320, 8-bit 并行接口 (I8080)
;
; 编译: pio run
; 烧录: pio run -t upload   (首次可能需要按住 BOOT 再插 USB)
; 监视: pio device monitor
; ============================================================
[env:tdisplay-s3]
platform = espressif32@6.9.0
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  ; ---- TFT_eSPI:等效官方 User_Setups/Setup206_LilyGo_T_Display_S3.h ----
  -DUSER_SETUP_LOADED
  -DST7789_DRIVER
  -DINIT_SEQUENCE_3
  -DCGRAM_OFFSET
  -DTFT_RGB_ORDER=TFT_RGB
  -DTFT_INVERSION_ON
  -DTFT_PARALLEL_8_BIT
  -DTFT_WIDTH=170
  -DTFT_HEIGHT=320
  -DTFT_CS=6
  -DTFT_DC=7
  -DTFT_RST=5
  -DTFT_WR=8
  -DTFT_RD=9
  -DTFT_D0=39
  -DTFT_D1=40
  -DTFT_D2=41
  -DTFT_D3=42
  -DTFT_D4=45
  -DTFT_D5=46
  -DTFT_D6=47
  -DTFT_D7=48
  -DTFT_BL=38
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD
  -DLOAD_FONT2
  -DLOAD_FONT4
  -DLOAD_FONT6
  -DLOAD_FONT7
  -DLOAD_FONT8
  -DLOAD_GFXFF
  -DSMOOTH_FONT
  ; ---- libopendroneid 选项 ----
  -DODID_DISABLE_PRINTF

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
